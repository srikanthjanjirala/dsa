version: 0.2

env:
    variables:
        AWS_REGION: us-east-1
        IMAGE_REPO_NAME: dsa
        IMAGE_TAG: latest

phases:

    install:
        runtime-versions:
            java: corretto17
        commands:
            - echo Install phase started
            - java -version
            - mvn -version

    pre_build:
        commands:
            - echo Pre-build phase started

            # Get commit hash (first 7 characters)
            - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

            # Set image tag as commit hash
            - IMAGE_TAG=$COMMIT_HASH

            - echo Commit hash: $COMMIT_HASH
            - echo Image tag: $IMAGE_TAG

            # Get AWS Account ID
            - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

            # Construct full repository URI dynamically
            - REPOSITORY_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME

            - echo Repository URI: $REPOSITORY_URI

            # Login to ECR
            - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

    build:
        commands:
            - echo Build started on `date`
            - cd user-service

            # Build Spring Boot JAR
            - mvn clean package -DskipTests

            # Build Docker image
            - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .

            # Tag Docker image
            - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

    post_build:
        commands:
            - echo Build completed on `date`
            - echo Pushing Docker image to ECR...
            # Push latest tag
            - docker push $REPOSITORY_URI:latest
            # Push Docker image
            - docker push $REPOSITORY_URI:$IMAGE_TAG

            # Create ECS image definition file
            - printf '[{"name":"user-service","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

            - echo Image pushed successfully

artifacts:
    files:
        - imagedefinitions.json
